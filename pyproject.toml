[project]
name = "web-scraper"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["beautifulsoup4", "httpx", "rich", "typer"]

[project.scripts]
scrape = "web_scraper.main:app"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
